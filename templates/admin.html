<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ wiki_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</head>
<body>
    <div class="menu">
        <a href="/w/{{ wiki_page }}" style="text-decoration: none; color: {{ wiki_color or 'white' }};"><b>{{ wiki_name or 'WIKI' }}</b></a>

        <details class="menu-more">
            <summary>더보기</summary>
            <div class="menu-more-panel">
                {% if session.get('user') %}
                    {% if is_operator %}
                        <a href="{{ url_for('manage_blocks') }}" class="box">차단 관리</a>
                        <form method="post" action="{{ url_for('operator_resignation') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                            <button class="box" type="submit">운영자 사퇴</button>
                        </form>
                    {% endif %}
                    {% if is_representative %}
                        <a href="{{ url_for('manage_users') }}" class="box">사용자 권한 관리</a>
                    {% endif %}
                    <a href="/Logout" class="box">로그아웃</a>
                {% else %}
                    <a href="/Sign_Up" class="box">회원가입</a>
                    <a href="/Revisit" class="box">로그인</a>
                {% endif %}
                <a href="/RandomPage" class="box">무작위 문서</a>
                <a href="{{ url_for('needed_documents') }}" class="box">문서 작성 필요</a>
            </div>
        </details>

        <form action="/search">
            <input type="text" name="q" placeholder="Search wiki...">
            <button>검색</button>
        </form>
    </div>
    <div class="container">
        {{ footer_content|safe }}
    </div>
</body>
</html>
